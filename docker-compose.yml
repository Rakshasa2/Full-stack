services:
  postgres:
    image: postgres:16-alpine
    container_name: codedoc_postgres
    init: true
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codedoc}
      POSTGRES_USER: ${POSTGRES_USER:-codedoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codedoc-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codedoc} -d ${POSTGRES_DB:-codedoc}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - codedoc_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codedoc_backend
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=${BACKEND_DATABASE_URL:-postgresql+psycopg://codedoc:codedoc-password@postgres:5432/codedoc}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY:-your-refresh-secret-key-here}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:1234}
      - LM_STUDIO_MODEL=${LM_STUDIO_MODEL:-qwen2.5-coder-1.5b-instruct}
      - LM_STUDIO_TIMEOUT=${LM_STUDIO_TIMEOUT:-60}
      - LM_STUDIO_TEMPERATURE=${LM_STUDIO_TEMPERATURE:-0.1}
      - MAX_FILES_TO_ANALYZE=${MAX_FILES_TO_ANALYZE:-50}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PYTHONPATH=/app
      - SITE_URL=${SITE_URL:-http://localhost}
      # S3 настройки
      # Внутри docker-сети MinIO доступен по имени сервиса, а не через localhost
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-codedoc-files}
      - S3_REGION=${S3_REGION:-us-east-1}
      - ALLOWED_FILE_TYPES=${ALLOWED_FILE_TYPES:-.pdf,.txt,.md,.json,.zip,.py,.js,.ts,.html,.css}
      # GitHub API preview
      - GITHUB_API_BASE_URL=${GITHUB_API_BASE_URL:-https://api.github.com}
      - GITHUB_API_TIMEOUT=${GITHUB_API_TIMEOUT:-5}
      - GITHUB_API_TOKEN=${GITHUB_API_TOKEN:-}
      - GITHUB_PREVIEW_RATE_LIMIT=${GITHUB_PREVIEW_RATE_LIMIT:-20}
      - GITHUB_PREVIEW_RATE_WINDOW=${GITHUB_PREVIEW_RATE_WINDOW:-60}
    volumes:
      - ./backend:/app
      - static_volume:/app/static
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - codedoc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codedoc_frontend
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-}
      - REACT_APP_SITE_URL=${REACT_APP_SITE_URL:-http://localhost}
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - codedoc_network

  minio:
    image: minio/minio:latest
    container_name: codedoc_minio
    init: true
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - codedoc_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: codedoc_nginx
    init: true
    restart: unless-stopped
    volumes:
      - static_volume:/static
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - codedoc_network

# Тома для хранения данных
volumes:
  postgres_data:
  static_volume:
  minio_data:

# Сеть
networks:
  codedoc_network:
    driver: bridge
